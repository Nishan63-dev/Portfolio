name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping portfolio to prevent spin-down
        run: |
          curl -fsS --max-time 30 https://nishan-portfolio.onrender.com/health || echo "Ping failed, service may be starting up"
